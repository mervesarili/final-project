<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Kortly</title>
  <link rel="stylesheet" href="styles.css">
</head>

<body>


  <main>




    <section id="manage-view" class="manage-layout">

      <div class="container add-card-container">
        <button id="buttonaddcard" class="circle-btn">
          ADD<br>A NEW<br>CARD
        </button>

        <form id="add-form" style="display: none;">
          <input type="text" id="question-input" placeholder="Question">
          <input type="text" id="answer-input" placeholder="Answer">
          <button type="submit">Save</button>
        </form>

        <div class="importFileContainer">
          <h3>Upload a JSON File</h3>
          <input type="file" id="jsonFileInput" accept=".json" class="inputJsonFile">
        </div>

      </div>




      <div class="container list-container">
        <ul id="cardlist">

        </ul>
      </div>



      <div class="container menu-container">
        <h1>Kortly</h1>

        <button id="buttonlonewolf" class="menu-btn">

          LONE WOLF

        </button>

        <button id="buttonplay" class="menu-btn">

          PLAY WITH A FRIEND

        </button>
      </div>
    </section>



  </main>




  <script>
    document.addEventListener("DOMContentLoaded", function () {
      console.log("The HTML is fully loaded and ready to go.");
    });
  </script>

  <script src="script.js"></script>
</body>

</html>
